name: Push to main
on:
  push:
    branches:
      - main

jobs:
  tests:
    name: Run all tests
    uses: ./.github/workflows/tests.yml

  publish:
    name: Publish docs website to Netlify
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      # Setup docs site
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
          working-directory: website

      # Install dependencies
      - run: npm ci
        working-directory: website

      - run: ./bin/static-build
        working-directory: website

      - name: Deploy production to Netlify
        uses: South-Paw/action-netlify-deploy@2e5ce944afb065f54453c5cc03291670687b454b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
          build-dir: ./website/build
          config-path: ./netlify.toml
