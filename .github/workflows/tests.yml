name: Run all tests
on: workflow_call

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  engine-specs:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby_version }} (${{ matrix.appraisal }})
    strategy:
      fail-fast: false
      matrix:
        # Test against active Ruby versions (https://endoflife.date/ruby)
        ruby_version: ["3.3", "3.4", "4.0"]
        # List appraisals to run in matrix for improved reporting
        appraisal: ["rails_7_2", "rails_8_0", "rails_8_1"]
        include:
          # Explicitly test against previously supported view component version
          # using the oldest supported Rails version. This can be removed when
          # we no longer want to test against view component 3.x directly
          - ruby_version: "3.3"
            appraisal: "view_component_3"
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby_version }}
          working-directory: engine
      - run: |
          bundle exec appraisal ${{ matrix.appraisal }} rake spec

  engine-lint:
    needs: engine-specs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          bundler-cache: true
          ruby-version: "4.0.5"
          working-directory: engine
      - run: bundle exec rubocop --format progress --format github
      - run: bundle exec erb_lint --lint-all

  demo-app:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Install Ruby and dependencies
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
          working-directory: demo

      - name: Install npm dependencies
        run: npm ci
        working-directory: demo

      - name: Run RuboCop
        run: bundle exec rubocop --format progress --format github
        working-directory: demo

      - name: Run Playwright
        run: bin/playwright-ci
        working-directory: demo

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: demo/playwright-report/
          retention-days: 7
