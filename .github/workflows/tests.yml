name: Run all tests
on: workflow_call

jobs:
  node-test:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  engine-specs:
    runs-on: ubuntu-latest
    name: Engine specs for Ruby ${{ matrix.ruby_version }} (${{ matrix.appraisal }})
    strategy:
      fail-fast: false
      matrix:
        # Test against active Ruby versions (https://endoflife.date/ruby)
        ruby_version: ["3.3", "3.4", "4.0"]
        # List appraisals to run in matrix for improved reporting
        appraisal: ["rails_8_0", "rails_8_1"]
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby_version }}
          working-directory: engine
      - run: |
          bundle exec appraisal ${{ matrix.appraisal }} rake spec

  engine-lint:
    name: Engine lint checks
    needs: engine-specs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
          ruby-version: "4.0.5"
          working-directory: engine
      - run: bundle exec rubocop --format progress --format github
      - run: bundle exec erb_lint --lint-all

  playwright:
    name: Playwright tests
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Install Ruby and dependencies
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
          working-directory: demo

      - name: Install npm dependencies
        run: npm ci
        working-directory: demo

      - name: Run RuboCop
        run: bundle exec rubocop --format progress --format github
        working-directory: demo

      - name: Run Playwright
        run: bin/playwright-ci
        working-directory: demo

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: demo/playwright-report/
          retention-days: 7
